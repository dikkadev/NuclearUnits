name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to release, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted

    env:
      BUILD_CONFIGURATION: Release
      GAME_DIR: /mnt/d/SteamLibrary/steamapps/common/Nuclear Option
      MANAGED_DIR: /mnt/d/SteamLibrary/steamapps/common/Nuclear Option/NuclearOption_Data/Managed
      BEPINEX_CORE_DIR: /mnt/d/SteamLibrary/steamapps/common/Nuclear Option/BepInEx/core

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify local game references
        run: |
          test -f "$MANAGED_DIR/Assembly-CSharp.dll"
          test -f "$BEPINEX_CORE_DIR/BepInEx.dll"
          test -f "$BEPINEX_CORE_DIR/0Harmony.dll"
        working-directory: NuclearUnits

      - name: Build plugin
        run: >-
          dotnet build NuclearUnits.csproj
          -c "$BUILD_CONFIGURATION"
          -p:NuclearOptionManagedDir="$MANAGED_DIR"
          -p:BepInExCoreDir="$BEPINEX_CORE_DIR"
        working-directory: NuclearUnits

      - name: Package release zip
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          rm -rf release
          mkdir -p release/NuclearUnits
          cp "bin/$BUILD_CONFIGURATION/netstandard2.1/NuclearUnits.dll" release/NuclearUnits/
          if [ -f "bin/$BUILD_CONFIGURATION/netstandard2.1/NuclearUnits.pdb" ]; then
            cp "bin/$BUILD_CONFIGURATION/netstandard2.1/NuclearUnits.pdb" release/NuclearUnits/
          fi
          cd release
          zip -r "NuclearUnits-${RELEASE_TAG}.zip" NuclearUnits
        working-directory: NuclearUnits

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: NuclearUnits/release/NuclearUnits-${{ github.event.inputs.release_tag || github.ref_name }}.zip
          generate_release_notes: true
